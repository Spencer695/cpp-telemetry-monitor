name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Linux (${{ matrix.sanitizer }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, thread]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTELEMETRY_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test core and real TCP connections
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
  qt-dashboard:
    name: Qt dashboard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt development libraries
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Configure dashboard and tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTELEMETRY_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test GUI behavior and backend
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DASHBOARD_SCREENSHOT: ${{ github.workspace }}/qt-dashboard.png
        run: ctest --test-dir build --output-on-failure
      - name: Save dashboard preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt-dashboard-preview
          path: qt-dashboard.png
          if-no-files-found: error
